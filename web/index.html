<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05070f">
    <link rel="icon" href="data:,">
    <title>Warden Zero</title>
    <style>
      /* Palette from src/style.css */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070f; color: #e6ecff;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: none;
        -webkit-user-select: none; user-select: none; }
      /* The canvas fills the window; Unity matches its render size to this (x devicePixelRatio). */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #05070f; }
      #unity-loading-bar { position: fixed; inset: 0; display: none; place-items: center; }
      #unity-loading-bar .box { display: flex; flex-direction: column; gap: 14px; align-items: center; }
      #unity-loading-bar .title { font-size: 34px; font-weight: 900; letter-spacing: 0.02em; }
      #unity-loading-bar .title span { color: #4fd1ff; text-shadow: 0 0 24px rgba(79, 209, 255, 0.5); }
      #unity-loading-bar .label { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #8a96b8; }
      #unity-progress { width: 260px; height: 6px; border: 1px solid #243154; border-radius: 3px; background: rgba(20, 27, 48, 0.85); overflow: hidden; }
      #unity-progress-bar-full { width: 0; height: 100%; background: #4fd1ff; box-shadow: 0 0 10px #4fd1ff; }
      #unity-warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: none; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="box">
        <div class="title">WARDEN <span>ZERO</span></div>
        <div id="unity-progress"><div id="unity-progress-bar-full"></div></div>
        <div class="label">Booting arena</div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Right mouse is the bomb, so keep the browser menu out of the way.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.style = "padding: 8px 12px; border-radius: 4px; background: " + (type == "error" ? "#ff4d5e" : "#141b30");
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") setTimeout(function () { banner.removeChild(div); if (!banner.children.length) banner.style.display = "none"; }, 5000);
      }

      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Warden Zero",
        productName: "Warden Zero",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // Render at device resolution, capped at 2x (as the Babylon version does).
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      document.querySelector("#unity-loading-bar").style.display = "grid";
      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function (instance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = instance;
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
